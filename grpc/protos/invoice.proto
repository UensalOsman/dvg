syntax = "proto3";

package invoice;

// Die Rechnung die der Client schickt
message InvoiceRequest {
    string name = 1;            
    string supplier = 2;         
    double amount = 3;          
    string currency = 4;         
    string due_date = 5;         
    string description = 6;      
}

// Die Antwort vom Server
message InvoiceResponse {
    bool success = 1;
    string message = 2;
    string invoice_id = 3;
    string name = 4;
}

// Anfrage um eine Rechnung abzurufen
message InvoiceQuery {
    string invoice_id = 1;
}

// Die Funktionen die der Server anbietet
service InvoiceService {
    rpc CreateInvoice (InvoiceRequest) returns (InvoiceResponse);
    rpc GetInvoice (InvoiceQuery) returns (InvoiceResponse);
}
