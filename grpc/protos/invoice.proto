syntax = "proto3";

package invoice;

// Die Rechnung die der Client schickt
message InvoiceRequest {
    string invoice_name = 1;
    string invoice_date = 2;
    string supplier_name = 3;            
    string vendor_number = 4;
    string customer_number = 5;         
    double amount = 6;          
    string currency = 7;         
    string due_date = 8;         
    string description = 9;
    repeated Position positions = 10;       
}

// Alle Artikel postionen
message Position {
    int32  position_no    = 1;
    string article        = 2;
    double quantity       = 3;
    string unit           = 4;
    double unit_price_net = 5;
    double tax_rate       = 6;
}

// Die Antwort vom Server
message InvoiceResponse {
    bool success = 1;
    string message = 2;
    string invoice_id = 3;
    string invoice_name = 4;
    string supplier_name = 5;
    double amount = 6;
    string currency = 7;
}

// Anfrage um eine Rechnung abzurufen
message InvoiceQuery {
    string invoice_id = 1;
}

// Die Funktionen die der Server anbietet
service InvoiceService {
    rpc CreateInvoice (InvoiceRequest) returns (InvoiceResponse);
    rpc GetInvoice (InvoiceQuery) returns (InvoiceResponse);
}
